[package]
name = "my-warp"
version = "0.8.14"
edition = "2021"
description = "Velt: ultra-low-RAM cross-platform (Windows & macOS) Rust terminal with session sidebar, user color themes, and syntax-colored input bar"

[[bin]]
name = "velt"
path = "src/main.rs"

[dependencies]
serde_json = "1"
# Cross-platform windowing & native 2D framebuffer (no GPU driver / WebView bloat)
winit = "0.30"
softbuffer = "0.4"
fontdue = "0.9"

# Cross-platform PTY (ConPTY on Windows, POSIX PTY on macOS) & zero-bloat VT parser
portable-pty = "0.8"
vte = "0.15"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
