[package]
name = "my-warp"
version = "0.1.0"
edition = "2021"
description = "Roby-Term: ultra-low-RAM cross-platform (Windows & macOS) Rust terminal with session sidebar, user color themes, and syntax-colored input bar"

[[bin]]
name = "roby-term"
path = "src/main.rs"

[dependencies]
# Cross-platform windowing & native 2D framebuffer (no GPU driver / WebView bloat)
winit = "0.30"
softbuffer = "0.4"
fontdue = "0.9"

# Cross-platform PTY (ConPTY on Windows, POSIX PTY on macOS) & zero-bloat VT parser
portable-pty = "0.8"
vte = "0.15"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
