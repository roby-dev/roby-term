name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target_name: windows-x64
            rust_target: x86_64-pc-windows-msvc
            bin_name: velt.exe
            artifact_name: velt-windows-x64.exe
          - os: macos-latest
            target_name: macos-arm64
            rust_target: aarch64-apple-darwin
            bin_name: velt
            artifact_name: velt-macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Run unit tests
        run: cargo test

      - name: Build release binary
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: cargo build --release --target ${{ matrix.rust_target }}

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p dist
          BIN_PATH="target/${{ matrix.rust_target }}/release/${{ matrix.bin_name }}"
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            codesign --force --sign - "$BIN_PATH"
            cp "$BIN_PATH" "dist/${{ matrix.artifact_name }}"

            VERSION="${GITHUB_REF_NAME#v}"
            [[ -z "$VERSION" || "$VERSION" == "$GITHUB_REF_NAME" ]] && VERSION="0.0.0"

            APP_DIR="dist/dmg-stage/Velt.app"
            mkdir -p "$APP_DIR/Contents/MacOS" "$APP_DIR/Contents/Resources"
            cp "$BIN_PATH" "$APP_DIR/Contents/MacOS/velt"
            chmod +x "$APP_DIR/Contents/MacOS/velt"

            cat > "$APP_DIR/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleExecutable</key>
            <string>velt</string>
            <key>CFBundleIdentifier</key>
            <string>com.robydev.velt</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>Velt</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${VERSION}</string>
            <key>CFBundleVersion</key>
            <string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key>
            <string>12.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF

            codesign --force --deep --sign - "$APP_DIR"
            ln -s /Applications dist/dmg-stage/Applications
            hdiutil create -volname "Velt" -srcfolder dist/dmg-stage -ov -format UDZO "dist/Velt-macos-arm64.dmg"
            rm -rf dist/dmg-stage
          else
            cp "$BIN_PATH" "dist/${{ matrix.artifact_name }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target_name }}
          path: dist/*

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
